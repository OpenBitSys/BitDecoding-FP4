      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="58" y1="0" x2="348" y2="0" gradientUnits="userSpaceOnUse">
