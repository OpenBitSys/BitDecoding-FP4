      <rect x="25" y="35" width="12" height="4" rx="2" fill="#88ad97"/>
      <rect x="42" y="35" width="12" height="4" rx="2" fill="#88ad97"/>
      <rect x="59" y="35" width="12" height="4" rx="2" fill="#88ad97"/>
      <rect x="76" y="35" width="12" height="4" rx="2" fill="#88ad97"/>
    </g>
