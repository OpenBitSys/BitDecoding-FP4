<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1000" viewBox="0 0 1440 1000" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">BitDecoding-FP4 system overview</title>
  <desc id="desc">Three layers connect the BitDecoding-FP4 algorithm to native FP4 decoding and vLLM serving. The algorithm uses dual-residual query quantization, outlier-aware key quantization with smoothing and shared query/key rotation, and underflow-aware probability scaling. The kernel stacks the query terms for FP4 matrix multiplication, joins the scores in FP32, and uses transposed softmax with fused probability quantization before the FP4 probability-value product. LSE-weighted combination joins FP4 page splits and BF16 sink/recent-token attention. A custom vLLM backend manages device-side metadata, paged FP4 keys and values with block scales, and a separate BF16 buffer for the first 16 tokens and recent tokens. Full recent pages are quantized and promoted to the paged cache. The schematic contains no measured results.</desc>
